changelog: |-
  - Fix: stop the per-second "user not logged in" log spam. Sessions that can't be
    scrobbled (user not logged into Simkl, scrobbling disabled, or item filtered) are
    now evaluated once and skipped silently instead of being re-checked and re-logged
    on every playback progress tick. Real-time scrobbling itself is unchanged.
  - Add real-time playback scrobbling: start / pause / stop lifecycle with the live
    "Watching now" banner and automatic watched-marking at 80% (server-side), per the
    Simkl scrobble guide. Replaces the previous one-shot progress polling.
  - Add "Real-time scrobbling" toggle and a "Minimum runtime" option to the settings page.
  - Fix invalid operation exception (#59) @balciseri
  - Revert "Update dependency Microsoft.Extensions.Http to v10" (#54) @Shadowghost

