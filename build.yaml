overview: "Real-time Simkl scrobbling (unofficial plugin)"
description: >
  WARNING: do not run this plugin alongside the official Simkl plugin. Both would
  scrobble every playback and send each watched item twice; keep one of the two.

  Scrobble your watched Movies, TV Shows and Anime to Simkl in real time and share your progress with friends!
  Unofficial plugin, not affiliated with or endorsed by Simkl or Jellyfin.

category: "General"
artifacts:
  - "Jellyfin.Plugin.Simkl.dll"
changelog: |-
  - Every user now finds an "RK Simkl Scrobbler" entry in their own menu,
    leading to the self-service page where they link their Simkl account and set
    their options, with nothing else to install. The plugin adds the entry to
    the web client as the page is served, on Jellyfin 10.11 (side drawer) as on
    12 (avatar menu), without touching any file on disk. It can be turned off
    from the admin page.
  - The optional Plugin Pages integration is retired: the entry it used to
    register is removed at startup, so the page never shows twice. Plugin Pages
    and File Transformation are no longer needed for anything.
  - The self-service page shows a "Back to Jellyfin" link when opened on its
    own.
