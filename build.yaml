overview: "Real-time Simkl scrobbling (unofficial plugin)"
description: >
  WARNING: do not run this plugin alongside the official Simkl plugin. Both would
  scrobble every playback and send each watched item twice; keep one of the two.

  Scrobble your watched Movies, TV Shows and Anime to Simkl in real time and share your progress with friends!
  Unofficial plugin, not affiliated with or endorsed by Simkl or Jellyfin.

category: "General"
artifacts:
  - "Jellyfin.Plugin.Simkl.dll"
changelog: |-
  - Progress within an episode now syncs from Simkl too. The import reads
    Simkl's paused playbacks and turns each one into a Jellyfin resume position,
    dated when it was paused, so it shows in Continue Watching at the right
    place. Episodes, films and anime (through their TVDB numbering) are covered.
  - Positions only ever move forward, and one within 30 seconds of Jellyfin's
    own is left alone. A watched item only takes a resume point paused after its
    last viewing here, a rewatch in progress, and its played mark is never
    changed. Resume points show in the preview, count in their own tile, and are
    undone with the rest of the import.
