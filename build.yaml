owner: "romskidd"
overview: "Real-time Simkl scrobbling (unofficial plugin)"
description: >
  WARNING: do not run this plugin alongside the official Simkl plugin. Both would
  scrobble every playback and send each watched item twice; keep one of the two.

  Scrobble your watched Movies, TV Shows and Anime to Simkl in real time and share your progress with friends!
  Unofficial plugin, not affiliated with or endorsed by Simkl or Jellyfin.

category: "General"
artifacts:
  - "Jellyfin.Plugin.Simkl.dll"
changelog: |-
  - Anime joins the Simkl sync. The import reads Simkl's anime list with its
    TVDB season mapping, so an episode Simkl files under a later anime season
    lands on the right season in Jellyfin; anime films are matched as movies.
    Anime already on Simkl is no longer offered again by the export, and every
    history write tells Simkl to read anime seasons the TVDB way.
  - The position on Simkl keeps up while you watch. The real position is sent
    again every 5 minutes, and at once after a skip or when watching faster or
    slower than normal, so the Watching now banner follows what is on screen. A
    per-profile option, on by default, on both settings pages.
