changelog: |-
  - The menu entry now shows when Jellyfin is reached through a reverse proxy
    that serves it under another path than its base URL (for example a proxy
    that strips /jellyfin). The script is now loaded by a relative path, so
    the browser resolves it against whatever address it used.
  - Checked on Jellyfin 10.11.11 and 12.4.
