  Scrobble your watched Movies, TV Shows and Anime to Simkl in real time and share your progress with friends!

category: "General"
artifacts:
  - "Jellyfin.Plugin.Simkl.dll"
changelog: |-
  - Manual check marks now sync to Simkl: ticking an episode, a season or a
    movie as played adds it to your Simkl history (batched into one request),
    and optionally unticking removes it (off by default).
  - Config page: shows your Simkl watch statistics and the last scrobble
    result, plus toggles for the new mark-played sync.
  - API compliance: every request now identifies the app to Simkl
    (app-name/app-version), as required by the Simkl API since April 2026.
